<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Driver Seniority Table</title>
<!-- DataTables CSS -->
<link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/jquery.dataTables.min.css"/>
<style>
  /* Reset and basic styles omitted for brevity, use previous styles or your own */
  * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
  }
  body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
  }
  h1 {
      text-align: center;
      margin-bottom: 20px;
  }
  .table-container {
      margin-top: 20px;
  }
  /* Additional styles as needed */
  @media (prefers-color-scheme: dark) {
    body {
      background-color: #222;
      color: #ddd;
    }
    table.dataTable thead th {
      background-color: #222;
    }
  }
</style>
</head>
<body>

<h1>Driver Seniority List</h1>
<div class="table-container">
  <table id="seniorityTable" class="display" style="width:100%">
    <thead>
      <tr>
        <th>Driver Seniority</th>
        <th>Driver</th>
        <th>FT Seniority Date</th>
        <th>Route</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- jQuery and DataTables JS -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
<script>
$(document).ready(function() {
  $('#seniorityTable').DataTable({
    ajax: 'seniority-data.json', // Path to your JSON data
    columns: [
      { data: 'Driver Seniority' },
      { data: 'Driver' },
      { 
        data: 'FT Seniority Date',
        render: function(data, type, row) {
          if (type === 'sort' || type === 'type') {
            // Parse date string into Date object for sorting
            const date = new Date(data);
            return date.toISOString().split('T')[0];
          }
          return data; // display original string
        }
      },
      { data: 'Route' }
    ],
    responsive: true,
    pageLength: -1, // Show all entries by default
    order: [[2, 'asc']], // Sort by date ascending
    lengthMenu: [
      [10, 25, 50, 100, -1],
      [10, 25, 50, 100, "All"]
    ],
    language: {
      search: "Search:",
      lengthMenu: "Show _MENU_ entries",
      info: "Showing _START_ to _END_ of _TOTAL_ entries",
      paginate: {
        first: "First",
        last: "Last",
        next: "Next",
        previous: "Previous"
      }
    }
  });
});
</script>
</body>
</html>
